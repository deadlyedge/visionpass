<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionPass - 视觉密语</title>
  <!-- 全局初始化 Emscripten Module 配置 -->
  <script type="text/javascript">
    window.Module = {
      onRuntimeInitialized: () => {
        console.log("[OpenCV.js] onRuntimeInitialized triggered successfully");
        window.__opencv_runtime_ready__ = true;
        window.dispatchEvent(new Event("opencv-ready"));
      }
    };
  </script>
  <!-- 预加载可靠 CDN 的 OpenCV.js -->
  <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@5.0.0-release.1/dist/opencv.js"
    type="text/javascript"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
